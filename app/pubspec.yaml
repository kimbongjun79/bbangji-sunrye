name: bbangji_sunrye
description: 대전 빵집·디저트·도넛·아이스크림·빙수 가게 지도 '빵지순례'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # 기본 지도 POI 숨김 기능을 추가한 사본(원본 1.3.1, BSD-3). third_party/kakao_map_sdk/BBANGJI_CHANGES.md 참고
  kakao_map_sdk:
    path: third_party/kakao_map_sdk
  geolocator: any
  http: any
  path_provider: any
  provider: any
  shared_preferences: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/stores.json
